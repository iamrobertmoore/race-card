[project]
name = "racecard"
version = "0.1.0"
description = "A race-day prediction from your own training export, using open models on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["tabpfn>=9", "pandas>=2", "numpy>=1.26"]

[project.scripts]
racecard = "racecard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["racecard"]
